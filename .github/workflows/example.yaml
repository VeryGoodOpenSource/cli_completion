name: example

on:
  pull_request:
    paths:
      - ".github/workflows/example.yaml"
      - "example/lib/**"
      - "example/test/**"
      - "example/pubspec.yaml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/example.yaml"
      - "example/lib/**"
      - "example/test/**"
      - "example/pubspec.yaml"

jobs:
  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/dart_package.yml@v2
    with:
      working_directory: "example/"
