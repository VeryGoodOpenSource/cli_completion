name: cli_completion

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/dart_package.yml@v2

  pana_score:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/pana.yml@v2

  integration_tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "example/"

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7

      - name: 🎯 Setup Dart
        uses: dart-lang/setup-dart@v1.8.2

      - name: 📦 Install Dependencies
        run: dart pub get

      - name: 🧪 Run Tests
        run: dart test --run-skipped -t integration -x known-issues
